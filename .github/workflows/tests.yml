name: Python tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest discover -s tests -v

  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependency
        run: python -m pip install playwright==1.63.0
      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Render synthetic fixture and exercise native failures
        env:
          ZSHOP_BROWSER_ENGINE: ${{ matrix.engine }}
        run: python -m unittest discover -s tests -p test_geisha_browser.py -v
