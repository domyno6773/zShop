name: Research Inkay coexistence patch (experimental)

on:
  workflow_dispatch:
  push:
    paths:
      - 'compat/inkay/**'
      - 'tests/test_inkay_patch.py'
      - '.github/workflows/build-inkay-compat.yml'

permissions:
  contents: read

jobs:
  build-compat:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout zShop
        uses: actions/checkout@v4
      - name: Checkout pinned Inkay upstream
        uses: actions/checkout@v4
        with:
          repository: PretendoNetwork/Inkay
          ref: f3a18d7021f31b9af30057f8e743a2e3723096c0
          path: inkay-upstream
          persist-credentials: false
      - name: Apply narrowly scoped patch (fail closed)
        run: |
          python3 compat/inkay/patch_skip_eshop.py inkay-upstream
          git -C inkay-upstream diff --check
          git -C inkay-upstream diff -- src/main.cpp
          python3 -m unittest tests/test_inkay_patch.py -v
      - name: Build pinned Inkay toolchain
        run: docker build -t zshop-inkay-builder inkay-upstream
      - name: Compile experimental Inkay pair
        run: docker run --rm -v "${PWD}/inkay-upstream:/app" -w /app zshop-inkay-builder make
      - name: Check plugin + module exist
        run: |
          test -s inkay-upstream/dist/Inkay-pretendo.wps
          test -s inkay-upstream/dist/Inkay-pretendo.wms
          file inkay-upstream/dist/*
          sha256sum inkay-upstream/dist/*
      - name: Upload research artifacts (not endorsed for console use)
        uses: actions/upload-artifact@v4
        with:
          name: inkay-zshop-research-NOT-FOR-INSTALL
          path: inkay-upstream/dist/*
          retention-days: 5
